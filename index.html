<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Glowing Menu avec titres</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <style>
    body {
      margin: 0;
      height: 100vh;
      background: #0f0f1a;
      font-family: sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .menu {
      position: relative;
      width: 250px;
      height: 250px;
    }

    .menuToggle {
      position: absolute;
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: #222;
      color: #fff;
      font-size: 2em;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      z-index: 1000;
      transition: transform 1.5s;
    }

    .menu.active .menuToggle {
      transform: rotate(315deg);
    }

    .menu ul {
      position: absolute;
      width: 100%;
      height: 100%;
      top: 0;
      left: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 0;
      margin: 0;
      list-style: none;
    }

    .menu li {
      position: absolute;
      transform: rotate(calc(360deg / 7 * var(--i))) translate(100px) rotate(calc(-360deg / 7 * var(--i)));
      transition: 0.5s;
    }

    .menu li a {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 70px;
      height: 70px;
      background: transparent;
      border: 2px solid var(--clr);
      color: transparent;
      font-size: 1.5em;
      border-radius: 10px;
      text-decoration: none;
      transition: 0.5s;
      position: relative;
    }

    .menu.active li a {
      color: var(--clr);
    }

    .menu li a span {
      font-size: 0.7em;
      margin-top: 5px;
      opacity: 0;
      color: #fff;
      white-space: nowrap;
      transition: opacity 0.3s;
    }

    .menu li a:hover {
      box-shadow: 0 0 10px var(--clr),
                  0 0 20px var(--clr),
                  0 0 40px var(--clr);
    }

    .menu li a:hover span {
      opacity: 1;
    }
  </style>
</head>
<body>

<div class="menu">
  <div class="menuToggle">×</div>
  <ul>
    <li style="--i:0; --clr:#f39c12"><a href="#identification"><i class="fas fa-id-card"></i><span>Identification</span></a></li>
    <li style="--i:1; --clr:#1abc9c"><a href="#apparences"><i class="fas fa-user"></i><span>Apparences physiques</span></a></li>
    <li style="--i:2; --clr:#9b59b6"><a href="#capacites-physiques"><i class="fas fa-dumbbell"></i><span>Capacités physiques</span></a></li>
    <li style="--i:3; --clr:#3498db"><a href="#capacites-magiques"><i class="fas fa-hat-wizard"></i><span>Capacités magiques</span></a></li>
    <li style="--i:4; --clr:#e74c3c"><a href="#faiblesses"><i class="fas fa-heart-broken"></i><span>Faiblesses</span></a></li>
    <li style="--i:5; --clr:#ff00ff"><a href="#mentalite"><i class="fas fa-brain"></i><span>Mentalité</span></a></li>
    <li style="--i:6; --clr:#00ffff"><a href="#histoire"><i class="fas fa-book-open"></i><span>Histoire</span></a></li>
  </ul>
</div>

<script>
  const menu = document.querySelector('.menu');
  const toggle = document.querySelector('.menuToggle');

  toggle.addEventListener('click', () => {
    menu.classList.toggle('active');
  });
</script>

</body>
</html>
